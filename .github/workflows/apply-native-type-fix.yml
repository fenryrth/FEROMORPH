name: Apply native type fix

on:
  push:
    branches: ["agent/native-godot"]
    paths:
      - ".github/workflows/apply-native-type-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v6
        with:
          ref: agent/native-godot
          show-progress: false

      - name: Apply explicit GDScript types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("native/scripts/main.gd")
          source = path.read_text()
          replacements = {
              "    var vertical_bias := rng.randf_range(-0.22, 0.22)": "    var vertical_bias: float = rng.randf_range(-0.22, 0.22)",
              "    var turn := rng.randf_range(-PI, PI)": "    var turn: float = rng.randf_range(-PI, PI)",
              "        var fi := float(i)": "        var fi: float = float(i)",
              "        var core_weight := 0.18 if i < 3 else 1.0": "        var core_weight: float = 0.18 if i < 3 else 1.0",
              "        var angle := turn + TAU * fi / max(1.0, float(count)) + rng.randf_range(-0.66, 0.66)": "        var angle: float = turn + TAU * fi / maxf(1.0, float(count)) + rng.randf_range(-0.66, 0.66)",
              "        var radial := rng.randf_range(0.42, 1.72) * core_weight": "        var radial: float = rng.randf_range(0.42, 1.72) * core_weight",
              "        var y := rng.randf_range(-1.55, 1.5) + vertical_bias": "        var y: float = rng.randf_range(-1.55, 1.5) + vertical_bias",
              "        var position := Vector3(cos(angle) * radial, y, sin(angle) * radial)": "        var position: Vector3 = Vector3(cos(angle) * radial, y, sin(angle) * radial)",
              "        var size := rng.randf_range(0.48, 0.95)": "        var size: float = rng.randf_range(0.48, 0.95)",
              "        var scale := Vector3(": "        var scale_value: Vector3 = Vector3(",
              "            scale *= rng.randf_range(0.65, 0.86)": "            scale_value *= rng.randf_range(0.65, 0.86)",
              "            \"scale\": scale,": "            \"scale\": scale_value,",
              "        var phase_value := lerp(float(a[\"phase\"]), float(b[\"phase\"]), morph)": "        var phase_value: float = lerpf(float(a[\"phase\"]), float(b[\"phase\"]), morph)",
              "        var drift_value := lerp(float(a[\"drift\"]), float(b[\"drift\"]), morph)": "        var drift_value: float = lerpf(float(a[\"drift\"]), float(b[\"drift\"]), morph)",
              "        var drift := Vector3(": "        var drift: Vector3 = Vector3(",
              "        var outward := position.normalized() if position.length() > 0.01 else Vector3.UP": "        var outward: Vector3 = position.normalized() if position.length() > 0.01 else Vector3.UP",
              "        var breath := 1.0 + sin(elapsed * 0.16 + phase_value) * 0.035 * movement": "        var breath: float = 1.0 + sin(elapsed * 0.16 + phase_value) * 0.035 * movement",
              "    body_material.metallic = lerp(float(palette_a[\"metallic\"]), float(palette_b[\"metallic\"]), morph)": "    body_material.metallic = lerpf(float(palette_a[\"metallic\"]), float(palette_b[\"metallic\"]), morph)",
              "    body_material.roughness = lerp(float(palette_a[\"roughness\"]), float(palette_b[\"roughness\"]), morph)": "    body_material.roughness = lerpf(float(palette_a[\"roughness\"]), float(palette_b[\"roughness\"]), morph)",
              "    link_material.metallic = clamp(body_material.metallic + 0.05, 0.0, 1.0)": "    link_material.metallic = clampf(body_material.metallic + 0.05, 0.0, 1.0)",
              "    link_material.roughness = clamp(body_material.roughness + 0.08, 0.0, 1.0)": "    link_material.roughness = clampf(body_material.roughness + 0.08, 0.0, 1.0)",
              "        position += outward * rupture * lerp(float(a[\"rupture\"]), float(b[\"rupture\"]), morph)": "        position += outward * rupture * lerpf(float(a[\"rupture\"]), float(b[\"rupture\"]), morph)",
              "        var micro_rotation := Quaternion(Vector3.UP, sin(elapsed * 0.07 + phase_value) * 0.035 * movement)": "        var micro_rotation: Quaternion = Quaternion(Vector3.UP, sin(elapsed * 0.07 + phase_value) * 0.035 * movement)",
              "        var pulse := 0.84 + sin(elapsed * 0.23 + float(data[\"phase\"])) * 0.12": "        var pulse: float = 0.84 + sin(elapsed * 0.23 + float(data[\"phase\"])) * 0.12",
              "        var thickness := float(data[\"thickness\"]) * pulse * (1.0 - rupture * 0.34)": "        var thickness: float = float(data[\"thickness\"]) * pulse * (1.0 - rupture * 0.34)",
              "    var camera_angle := elapsed * 0.026 + float(seed_value % 1000) * 0.001": "    var camera_angle: float = elapsed * 0.026 + float(seed_value % 1000) * 0.001",
              "    var radius := 8.2 + sin(elapsed * 0.041) * 0.38": "    var radius: float = 8.2 + sin(elapsed * 0.041) * 0.38",
              "    var fps := Engine.get_frames_per_second()": "    var fps: int = Engine.get_frames_per_second()",
              "        low_fps_seconds = max(0.0, low_fps_seconds - delta * 0.5)": "        low_fps_seconds = maxf(0.0, low_fps_seconds - delta * 0.5)",
              "func _unhandled_key_input(event: InputEvent) -> void:\n    if not event.pressed or event.echo:\n        return\n\n    match event.keycode:": "func _unhandled_key_input(event: InputEvent) -> void:\n    if not event is InputEventKey:\n        return\n    var key_event := event as InputEventKey\n    if not key_event.pressed or key_event.echo:\n        return\n\n    match key_event.keycode:",
              "    var image := get_viewport().get_texture().get_image()": "    var image: Image = get_viewport().get_texture().get_image()",
              "    var stamp := Time.get_datetime_string_from_system().replace(\":\", \"-\")": "    var stamp: String = Time.get_datetime_string_from_system().replace(\":\", \"-\")",
              "    var path := \"user://FEROMORPH_%s_%s.png\" % [str(seed_value), stamp]": "    var path: String = \"user://FEROMORPH_%s_%s.png\" % [str(seed_value), stamp]",
              "    var result := image.save_png(path)": "    var result: Error = image.save_png(path)",
              "    var x := clamp((value - edge0) / (edge1 - edge0), 0.0, 1.0)": "    var x: float = clampf((value - edge0) / (edge1 - edge0), 0.0, 1.0)",
              "    var middle := (start + finish) * 0.5": "    var middle: float = (start + finish) * 0.5",
              "    var up := _smoothstep(start, middle, value)": "    var up: float = _smoothstep(start, middle, value)",
              "    var down := 1.0 - _smoothstep(middle, finish, value)": "    var down: float = 1.0 - _smoothstep(middle, finish, value)",
              "    return min(up, down)": "    return minf(up, down)",
          }

          missing = []
          for old, new in replacements.items():
              if old not in source:
                  missing.append(old)
              source = source.replace(old, new)

          if missing:
              raise SystemExit("Missing expected source fragments: " + repr(missing))

          path.write_text(source)
          PY

      - name: Commit type corrections
        run: |
          git config user.name "FEROMORPH CI"
          git config user.email "actions@users.noreply.github.com"
          git add native/scripts/main.gd
          git commit -m "Fix native GDScript types"
          git push origin HEAD:agent/native-godot
